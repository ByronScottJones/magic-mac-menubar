name: CI

on:
  workflow_dispatch:

# Least privilege by default; jobs elevate only when needed.
permissions:
  contents: read

# Cancel stale runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Unit tests
        run: swift test
      - name: Assemble app bundle
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Magic.app
          path: dist/Magic.app
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: ShellCheck
        run: brew install shellcheck && shellcheck scripts/*.sh
      - name: Markdown lint
        run: npx --yes markdownlint-cli2 '**/*.md' '#.git/**'
